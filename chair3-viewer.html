<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chair 3 viewer</title>
<script>
  // chair3.glb is meshopt-compressed; model-viewer needs the decoder's location before it loads.
  self.ModelViewerElement = self.ModelViewerElement || {};
  self.ModelViewerElement.meshoptDecoderLocation = 'https://cdn.jsdelivr.net/npm/meshoptimizer@0.21.0/meshopt_decoder.js';
</script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #f4f4f2; font-family: system-ui, sans-serif; }
  model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
</style>
</head>
<body>
  <!-- Test page for the baked chair. Same settings to use on the site. -->
  <model-viewer
    src="chair3.glb"
    alt="Bent plywood and steel lounge chair"
    camera-controls
    touch-action="pan-y"
    tone-mapping="neutral"
    exposure="1"
    shadow-intensity="0"
    camera-target="0m 0.3m -0.03m"
    camera-orbit="35deg 72deg 2.4m"
    interaction-prompt="none">
  </model-viewer>
  <script>
    // The ground shadow is baked into the model (material "shadow_web"); this sets its strength (0 to 1).
    const mv = document.querySelector('model-viewer');
    mv.addEventListener('load', () => {
      const m = mv.model.materials.find(x => x.name === 'shadow_web');
      if (m) m.pbrMetallicRoughness.setBaseColorFactor([0, 0, 0, 0.8]);
    });
  </script>
</body>
</html>
